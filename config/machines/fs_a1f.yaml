schema_version: 1
id: fs_a1f
name: "Panasonic FS-A1F (MSX2, Japan)"
generation: msx2
video_standard: ntsc
rom_base: roms/fs_a1f
cpu:
  type: z80a
  clock_mhz: 3.579545
  m1_wait_states: 1 # MSX inserts 1 wait per M1 (opcode fetch)

# Panasonic FS-A1F. Slot 3 follows openMSX's machine description
# (references/openMSX/share/machines/Panasonic_FS-A1F.xml); not verified on
# real hardware. Four independent secondary slots -- 0 = 64 KB memory
# mapper RAM (ports 0xFC-0xFF), 1 = SUB ROM (16 KB,
# page 0), 2 = the TC8566AF FDC (`<io_regs>7FF8</io_regs>`) + its DISK ROM
# window (pages 1-2, as openMSX's `<mem base="0x4000" size="0x8000"/>`: the
# DISK ROM shows in page 1 only, and page 2 shows only the registers at
# 0xBFF8-0xBFFF). msx/memory.py resolves each role (SUB ROM, FDC, RAM mapper)
# from its own sub-slot index (openspec/specs/memory-slot-bus/spec.md).
#
# Two things real hardware has that this machine does not model, neither
# needed to exercise the FDC (this machine's actual purpose):
#   - Sub-slot 1's second ROM device, the Kanji Driver ROM (32 KB, pages
#     1-2): the loader cannot place a second ROM device in the pages a
#     sub-slot's SUB ROM leaves free.
#   - Sub-slot 3, the bundled "A1 Cockpit" software ROM -- left undeclared
#     (open bus) entirely, not merely relocated.
#
# Real hardware ships all four ROM images (BASIC/SUB/DISK/Kanji driver,
# plus Cockpit) concatenated in one 128 KB mask ROM (openMSX:
# DA1024D0365R.rom, sha1 9a62d7a5ccda974261f7c0600476d85e10deb99b); this
# project's loader has no byte-offset ROM-window support, so the ROM
# entries below expect that file pre-split into its BASIC+BIOS, SUB, and
# DISK component pieces -- no per-slice advisory sha1 is available since
# openMSX itself never hashes the individual slices, only the combined
# file.
slots:
  primary:
    0:
      content:
        - rom:
            file: fs-a1f_basic-bios2.rom
            size_kb: 32
            pages: [0, 1]
    1: { type: cartridge }
    2: { type: cartridge }
    3:
      expanded: true
      secondary:
        0:
          type: ram
          size_kb: 64
          mapper: standard
        1:
          content:
            - rom:
                file: fs-a1f_msx2sub.rom
                size_kb: 16
                pages: [0]
        2:
          fdc:
            ref: fdc_tc8566af
            controller: tc8566af
            connection_style: tc8566af
            drives: 1
            rom:
              file: fs-a1f_disk.rom
              size_kb: 16
              pages: [1]

builtin_devices:
  - ref: ppi8255
    # S1985 MSX-ENGINE PPI: no control-word readback (same S1985 as the HB-F1XD; not verified on a real FS-A1F).
    overrides: { keyboard_type: jp, control_read: open_bus }
  - ref: vdp_v9938
    overrides: { vram_kb: 128 }
  - ref: psg_ay8910
  - ref: cassette_port
    # Cassette input on PSG R#14 bit 7, motor on PPI Port C bit 4 (openMSX
    # machine files have a CassettePort).
  - ref: printer_port
    # Port decode (openMSX; not verified on a real FS-A1F).
    overrides: { form: s1985 }
  - ref: rtc_rp5c01
  - ref: mapper_io
    # S1985 MSX-ENGINE latch: 0xFC-0xFF read (last write & 0x1F) | 0x80 (S1985 MSX-ENGINE as in openMSX; not verified on a real FS-A1F).
    overrides: { form: s1985 }
  - ref: memory_mapper_standard

default_extensions: []
