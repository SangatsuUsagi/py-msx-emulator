schema_version: 1
id: fs_a1f
name: "Panasonic FS-A1F (MSX2, Japan)"
generation: msx2
video_standard: ntsc
rom_base: roms/fs_a1f
cpu:
  type: z80a
  clock_mhz: 3.579545
  m1_wait_states: 1  # MSX inserts 1 wait per M1 (opcode fetch)

# Panasonic FS-A1F -- PROVISIONAL wiring, not yet a full match for real
# hardware's slot layout. Real hardware (openMSX's
# references/openMSX/share/machines/Panasonic_FS-A1F.xml, cross-checked
# against this codebase for this update) wires slot 3 as four *separate*
# secondary slots: 0 = 64 KB MemoryMapper RAM, 1 = SUB ROM (16 KB, page 0)
# + Kanji Driver ROM (32 KB, pages 1-2, a second ROM device in the same
# secondary slot), 2 = the TC8566AF FDC (`<io_regs>7FF8</io_regs>`) + its
# own DISK ROM window (pages 1-2, 32 KB, mirrored from a 16 KB slice of the
# combined file), 3 = the bundled "A1 Cockpit" software ROM (32 KB).
#
# This project's `msx/memory.py` cannot express that layout yet: its slot-3
# sub-slot dispatch hard-codes SUB ROM to sub-slot 0 page 0 and the FDC to
# sub-slot 0 page 1 (`sub0_rom` / `if sub == 0: ...` -- there is no
# configurable sub-slot index for either), and `machine_loader.py`'s
# `_parse_fdc`/sub-ROM extraction only ever look at secondary slot 0. Both
# are core memory-bus code shared by every MSX2 machine (including
# hb_f1xd), not something to change for this machine alone without a
# proper regression pass. Until a follow-up OpenSpec change generalises
# that (making the SUB-ROM-owning and FDC-owning sub-slot indices
# configurable), this machine keeps SUB ROM and the FDC combined in
# sub-slot 0 -- the same shape config/machines/hb_f1xd.yaml already uses --
# rather than sub-slots 1/2 as real hardware does. RAM lives in sub-slot 3
# (any index other than 0 works equally under the current architecture;
# real hardware's own numbering does not carry over here either way).
# Also not modelled at all (not merely relocated): the Kanji Driver ROM/
# font (no Kanji device exists in this codebase) and the "A1 Cockpit"
# bundled software ROM -- neither is needed to exercise the FDC, this
# machine's actual purpose.
#
# Real hardware ships all four ROM images (BASIC/SUB/DISK/Kanji driver,
# plus Cockpit) concatenated in one 128 KB mask ROM (openMSX:
# DA1024D0365R.rom, sha1 9a62d7a5ccda974261f7c0600476d85e10deb99b); this
# project's loader also has no byte-offset ROM-window support separately
# from the sub-slot-index limitation above, so the two ROM entries below
# expect that file pre-split into its BASIC+BIOS and SUB+DISK component
# pieces -- no per-slice advisory sha1 is available since openMSX itself
# never hashes the individual slices, only the combined file.
slots:
  primary:
    0:
      content:
        - rom:
            file: fs-a1f_basic-bios2.rom
            size_kb: 32
            pages: [0, 1]
    1: {type: cartridge}
    2: {type: cartridge}
    3:
      expanded: true
      secondary:
        0:
          content:
            - rom:
                file: fs-a1f_msx2sub.rom
                size_kb: 16
                pages: [0]
          fdc:
            ref: fdc_tc8566af
            controller: tc8566af
            connection_style: tc8566af
            drives: 1
            rom:
              file: fs-a1f_disk.rom
              size_kb: 16
              pages: [1]
        3:
          type: ram
          size_kb: 64

builtin_devices:
  - ref: ppi8255
    overrides: {keyboard_type: jp}
  - ref: vdp_v9938
    overrides: {vram_kb: 128}
  - ref: psg_ay8910
  - ref: rtc_rp5c01

default_extensions: []
