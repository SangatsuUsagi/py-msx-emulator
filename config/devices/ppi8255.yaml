id: ppi8255
type: io_device
implemented: true
name: Intel 8255A Programmable Peripheral Interface
chip: i8255a
io_ports: [0xA8, 0xA9, 0xAA, 0xAB]
controls: slot_register_and_keyboard_matrix
# Keyboard layout: "int" (International) or "jp" (Japanese/JIS). Machines may
# override this per builtin_devices entry (Japanese machines set "jp").
keyboard_type: int
# What a port 0xAB read returns: "control" (the last mode-set word, CMOS
# 82C55A behaviour, as openMSX models it), "open_bus" (0xFF: the S1985
# MSX-ENGINE on a real HB-F1XD) or "bus_latch" (the byte latched by the last
# PPI access: the S3527 MSX-ENGINE on a real HB-10). Machines override it.
control_read: control
