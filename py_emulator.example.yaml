# py-msx-emulator startup configuration (example).
#
# Copy this file to `py_emulator.yaml` in the repository root to set your
# preferred defaults. Every key is optional; omit a key to keep the built-in
# default. Command-line arguments always override values set here.
#
#   precedence:  built-in default  <  py_emulator.yaml  <  CLI argument
#
# `py_emulator.yaml` is git-ignored, so your local settings stay out of version
# control. If the file is absent, the emulator behaves exactly as before.

# Default machine configuration ID (a YAML file under config/machines/).
# When unset, the machine is auto-detected from the cartridge ROM database.
machine: cbios_msx2_jp

# Emulation speed multiplier (1.0 = real time). Must be positive.
speed: 1.0

# Integer window scale over the 256x212 base resolution. Must be a positive
# integer (e.g. 2 for a small display, 4 for a large one). Ignored in headless
# modes (--benchmark / --count-frame).
scale: 3

# Slot 1 cartridge ROM path (relative to the repository root). Leave unset
# to use the positional cartridge argument instead (default). Conflicts
# with `extension1`. The slot 1 mapper is CLI-only (--mapper/--mapper1,
# default auto) -- not configurable here.
# slot1: roms/slot1.rom

# Slot 2 cartridge ROM path (relative to the repository root). Leave unset
# for no slot 2 cartridge (default). Conflicts with `extension2`. The slot 2
# mapper is CLI-only (--mapper2, default auto) -- not configurable here.
# slot2: roms/slot2.rom

# Drive A floppy disk image list (relative to the repository root): one path
# or a list. The first image is mounted at startup; F6 mounts the next one and
# Shift+F6 ejects / re-inserts it. Ignored on machines without an FDC. A
# --fdd1 on the command line replaces the whole list.
# fdd1: [disks/a.dsk, disks/b.dsk]

# Overlay a slot 1/slot 2 extension device: "fmpac" (MSX-MUSIC + 8 KB SRAM)
# or "scc_plus" (an SCC-I / SCC+ cartridge: 64 KB bank-switched RAM, blank --
# no ROM/data file is ever loaded -- plus the SCC sound chip), among others
# documented in docs/README_extension.md. `extension1` conflicts with a
# slot 1 cartridge (--slot1/--mapper1 / slot1 above); `extension2` conflicts
# with a slot 2 cartridge (--slot2/--mapper2 / slot2 above). The same id
# cannot be set on both slots at once. The bare `extension` key below still
# works too, as a legacy alias for `extension2`.
# extension1: fmpac
# extension2: hbi_j1
# extension: fmpac

# Frame skip mode: true = auto (adapt to frame overruns, default), false =
# none (always render every frame; may stutter under load).
frame_skip: true

# Embedded Unix-socket JSON-RPC control server (interactive run mode only).
rpc:
  enabled: false
  socket: /tmp/py_msx_emu.sock

# Gamepad (SDL GameController) settings.
joystick:
  # Turbo (auto-fire) rate in Hz. Converted internally to whole 60 fps frames
  # via round(60 / turbo_hz); exact only when the rate divides 60 (e.g. 10, 12,
  # 15, 20, 30). Must be positive.
  turbo_hz: 20

  # Assign each MSX joystick function to an SDL GameController button label.
  # Any function left out keeps its default (shown below). No two functions may
  # share the same button.
  #
  # Valid button labels: a, b, x, y, back, guide, start, leftstick, rightstick,
  # leftshoulder, rightshoulder, dpup, dpdown, dpleft, dpright.
  buttons:
    up:        dpup
    down:      dpdown
    left:      dpleft
    right:     dpright
    trigger_a: a
    trigger_b: b
    turbo_a:   y   # auto-fire Trigger A
    turbo_b:   x   # auto-fire Trigger B

# Joy1 keyboard emulation key overrides. Unlike the gamepad `joystick.buttons`
# above, each built-in default here is actually TWO keys (e.g. up = w AND the
# Up arrow); setting a function below replaces BOTH of its default keys with
# the single key given — there is no partial/alternate-key merge. Leave a
# function out (or the whole `buttons` mapping empty, as below) to keep its
# built-in default(s) unchanged. No two functions may resolve to the same key.
keyboard_joystick:
  # Valid key names: a-z, 0-9, up, down, left, right, comma, period.
  buttons: {}
    # up:        i      # built-in default: w, up arrow
    # down:      k      # built-in default: s, down arrow
    # left:      j      # built-in default: a, left arrow
    # right:     l      # built-in default: d, right arrow
    # trigger_a: n      # built-in default: z, comma
    # trigger_b: m      # built-in default: x, period

# MSX mouse, driven by the host mouse (SDL relative-mouse mode). Attaches to
# a joystick port in place of the physical/keyboard joystick on that port.
# `--mouse` on the command line always overrides this section.
mouse:
  enabled: false
  port: 2   # 1 (Joy1) or 2 (Joy2)
