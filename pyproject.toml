[project]
name = "py-msx-emulator"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0", "Pillow>=9.0", "pysdl2>=0.9"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.10", "ruff>=0.4", "pyyaml>=6.0"]

[tool.ruff]
line-length = 99
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

# The test suite is intentionally not held to --strict: tests rely on fixtures,
# monkeypatch, and base-typed handles (e.g. machine.vdp) that make full typing
# high-effort and low-value. Source (msx/, frontend/, scripts/) stays strict.
[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["msx", "frontend"]
