[project]
name = "py-msx-emulator"
version = "2.6.0"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "Pillow>=12.0", "pysdl2>=0.9.16"]

[project.optional-dependencies]
# MCP server for Claude Code integration (only needed to run tools/mcp_server.py;
# the emulator and its socket RPC server have no extra runtime dependency).
mcp = ["mcp[cli]>=1.0"]
# Full dev toolset; kept in sync with requirements-dev.txt.
dev = [
    # Testing
    "pytest>=8.0",
    "pytest-cov>=7.0",
    "pytest-mock>=3.10",
    "pytest-xdist>=3.0",
    "hypothesis>=6.0",
    "coverage>=7.14",
    "diff-cover>=9.0",
    # Type checking
    "mypy>=1.10",
    # Lint / formatting
    "ruff>=0.4",
    # Static analysis (complexity, dead code, dependency hygiene)
    "radon>=6.0",
    "vulture>=2.10",
    "deptry>=0.20",
    # Profiling
    "scalene>=1.5",
    "py-spy>=0.4",
    # MCP server (so its tests can run in the dev environment)
    "mcp[cli]>=1.0",
]

[tool.ruff]
line-length = 99
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

# The test suite is intentionally not held to --strict: tests rely on fixtures,
# monkeypatch, and base-typed handles (e.g. machine.vdp) that make full typing
# high-effort and low-value. Source (msx/, frontend/, scripts/) stays strict.
[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["msx", "frontend"]

# numpy is not a project dependency; it is pulled into the dev env only as a
# transitive dep of scalene, and its type stubs use Python 3.12 `type` syntax
# that fails under python_version = "3.10". Skip analysing it (source never
# imports numpy; PIL's stubs reference it).
[[tool.mypy.overrides]]
module = "numpy.*"
follow_imports = "skip"
follow_imports_for_stubs = true
